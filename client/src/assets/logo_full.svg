<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="nucleusF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="orbitF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:0.5"/>
    </linearGradient>
  </defs>
  <!-- Logo Icon with Atom Structure -->
  <g transform="translate(5, 5)">
    <!-- Orbit rings -->
    <ellipse cx="25" cy="25" rx="20" ry="7" fill="none" stroke="url(#orbitF)" stroke-width="1.5" transform="rotate(-45 25 25)"/>
    <ellipse cx="25" cy="25" rx="20" ry="7" fill="none" stroke="url(#orbitF)" stroke-width="1.5" transform="rotate(45 25 25)"/>
    <ellipse cx="25" cy="25" rx="20" ry="7" fill="none" stroke="url(#orbitF)" stroke-width="1.5" transform="rotate(0 25 25)"/>
    <!-- Electrons -->
    <circle cx="40" cy="14" r="3" fill="#4ade80"/>
    <circle cx="10" cy="36" r="3" fill="#4ade80"/>
    <circle cx="36" cy="40" r="3" fill="#22c55e"/>
    <!-- Nucleus -->
    <circle cx="25" cy="25" r="10" fill="url(#nucleusF)"/>
    <!-- A letter -->
    <text x="25" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">A</text>
  </g>
  <!-- Text -->
  <text x="75" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#22c55e">pexGPT</text>
</svg>
