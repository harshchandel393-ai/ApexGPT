<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="nucleus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <!-- Orbit paths (ellipses) -->
  <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="url(#orbit)" stroke-width="1" transform="rotate(-45 20 20)"/>
  <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="url(#orbit)" stroke-width="1" transform="rotate(45 20 20)"/>
  <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="url(#orbit)" stroke-width="1" transform="rotate(0 20 20)"/>
  <!-- Electrons -->
  <circle cx="32" cy="12" r="2.5" fill="#4ade80"/>
  <circle cx="8" cy="28" r="2.5" fill="#4ade80"/>
  <circle cx="28" cy="32" r="2.5" fill="#22c55e"/>
  <!-- Nucleus -->
  <circle cx="20" cy="20" r="8" fill="url(#nucleus)"/>
  <!-- A letter on nucleus -->
  <text x="20" y="24" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">A</text>
</svg>
